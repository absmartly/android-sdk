apply plugin: 'com.android.library'
apply plugin: "signing"
apply plugin: "maven-publish"

ext {
    VERSION = rootProject.findProperty("VERSION_NAME") ?: System.getenv("VERSION_NAME") ?: "1.0.0-SNAPSHOT"
    GROUP_ID = "com.absmartly.sdk"
    is_release_version = !VERSION.endsWith("SNAPSHOT")
}

android {
    namespace 'com.absmartly.android.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName VERSION
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'consumer-proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests { includeAndroidResources = true }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // 1.7.0 contains system attributes, assignment rules and semver expression operators.
    api 'com.absmartly.sdk:core-api:1.7.0'
    api 'net.sourceforge.streamsupport:streamsupport-minifuture:1.7.4'
    // Keep Jackson 2.13.x for Android API 21-25 compatibility.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
}

task ship() { dependsOn('publish') }

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                artifactId = 'android-sdk'
                version = VERSION
                group = GROUP_ID
                customizePom(pom, 'A/B Smartly Android SDK')
                pom.description = 'A/B Smartly Android SDK'
                from components.release
            }
        }
        repositories {
            maven {
                name = "androidSonatype"
                url = uri(is_release_version
                        ? "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
                        : "https://s01.oss.sonatype.org/content/repositories/snapshots/")
                credentials {
                    username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
                    password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
                }
            }
        }
    }
    signing {
        useGpgCmd()
        sign publishing.publications.release
    }
}

def customizePom(pom, title) {
    pom.withXml {
        asNode().children().last() + {
            name title
            url 'https://www.absmartly.com'
            licenses {
                license {
                    name 'The Apache Software License, Version 2.0'
                    url 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution 'repo'
                }
            }
            developers {
                developer {
                    id 'absmartly'
                    name 'A/B Smartly'
                    email 'dev@absmartly.com'
                }
            }
            scm {
                connection 'scm:git:git://github.com/absmartly/android-sdk.git'
                developerConnection 'scm:git:ssh://github.com/absmartly/android-sdk.git'
                url 'https://github.com/absmartly/android-sdk'
            }
        }
    }
}

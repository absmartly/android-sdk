apply plugin: 'com.android.library'
apply plugin: "signing"
apply plugin: "maven-publish"

ext {
    VERSION = rootProject.ext.VERSION
    GROUP_ID = rootProject.ext.GROUP_ID
    is_release_version = rootProject.ext.is_release_version
}

// The nexus publish plugin picks the release or snapshot repository from the project version.
group = GROUP_ID
version = VERSION

android {
    namespace 'com.absmartly.android.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName VERSION

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Sent in the X-Agent header and the sdk_version system attribute.
        buildConfigField "String", "SDK_VERSION", "\"${VERSION}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'consumer-proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // core-api 1.7.0 adds assignment rules, the semver_* operators, system attributes and the
    // versioned X-Agent header. 1.8.0 moved to java.util.concurrent (API 24+), so stay on 1.7.x
    // while minSdk is 21.
    api 'com.absmartly.sdk:core-api:1.7.0'
    api 'net.sourceforge.streamsupport:streamsupport-minifuture:1.7.4'
    // Jackson 2.14+ introspection calls Constructor/Method.getParameterCount(), which is
    // unavailable before Android API 26. The SDK declares minSdk 21, so the dependency is
    // pinned to the latest 2.13.x line (last release compatible with API 21-25). This also
    // matches the version core-api 1.7.0 brings in transitively (2.13.4.2).
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
}

task ship() {
    dependsOn('publish')
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                artifactId = 'android-sdk'
                version = VERSION
                group = GROUP_ID

                customizePom(pom, 'A/B Smartly Android SDK')
                pom.description = 'A/B Smartly Android SDK'
                from components.release
            }
        }
        // The Sonatype repository is added by the nexus publish plugin in the root build.gradle.
    }

    signing {
        // The publish workflow imports the key into gpg and passes its fingerprint and passphrase
        // as environment variables. Reading them here, rather than from a properties file, keeps
        // the passphrase byte-for-byte (Java properties parsing drops backslashes and leading
        // spaces). Local builds use the signing.gnupg.* properties as usual.
        ["keyName": "SIGNING_GNUPG_KEY_NAME", "passphrase": "SIGNING_GNUPG_PASSPHRASE"].each { key, env ->
            def value = System.getenv(env)
            if (value) {
                project.ext.set("signing.gnupg.${key}", value)
            }
        }
        useGpgCmd()
        required { is_release_version }

        sign publishing.publications.release
    }
}

def customizePom(pom, title) {
    pom.withXml {
        asNode().children().last() + {
            name title
            url 'https://www.absmartly.com'
            licenses {
                license {
                    name 'The Apache Software License, Version 2.0'
                    url 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution 'repo'
                }
            }
            developers {
                developer {
                    id 'absmartly'
                    name 'A/B Smartly'
                    email 'dev@absmartly.com'
                }
            }
            scm {
                connection 'scm:git:git://github.com/absmartly/android-sdk.git'
                developerConnection 'scm:git:ssh://github.com/absmartly/android-sdk.git'
                url 'https://github.com/absmartly/android-sdk'
            }
        }
    }
}

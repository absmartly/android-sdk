// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false
    id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
}

ext {
    // Release builds pass the tag version with -PVERSION_NAME=<version>.
    VERSION = findProperty("VERSION_NAME") ?: "1.0.0-SNAPSHOT"
    GROUP_ID = "com.absmartly.sdk"
    is_release_version = !VERSION.endsWith("SNAPSHOT")
}

group = GROUP_ID
version = VERSION

task ship() {
    dependsOn(':android-sdk:ship')
}

task cleanAllModules () {
    logger.info("Running clean for all modules")
    dependsOn(':android-sdk:clean')
}

subprojects {

}

configure(rootProject) {
    apply plugin: "io.github.gradle-nexus.publish-plugin"

    nexusPublishing {
        repositories {
            // OSSRH (s01.oss.sonatype.org) was retired on 2025-06-30; publish through the Central
            // Portal's OSSRH-compatible staging API, as the Java SDK does.
            Sonatype {
                nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
                snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")

                username = findProperty("mavenCentralUsername")
                password = findProperty("mavenCentralPassword")
            }
        }
    }
}

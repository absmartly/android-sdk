name: Android CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and assemble release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      # TEMPORARY, remove once core-api-java6 1.9.0 is on Maven Central: this branch needs the core
      # release of absmartly/java-sdk#22, which is not published yet. Build it from the pinned #22
      # head, which is version 1.9.0, into the local Maven repository (settings.gradle resolves
      # mavenLocal first).
      # Releases cannot use it: publish.yml has no such step, so it fails to resolve 1.9.0 until the
      # real artifact is published.
      - name: Set up JDK 11 for java-sdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build core-api-java6 1.9.0 from java-sdk#22
        env:
          JAVA_SDK_SHA: 4ecfd78fd1e0e5e3c3d1843f0f8bae96f96331f1
        run: |
          git clone --quiet https://github.com/absmartly/java-sdk.git "$RUNNER_TEMP/java-sdk"
          cd "$RUNNER_TEMP/java-sdk"
          git checkout --quiet "$JAVA_SDK_SHA"
          JAVA_HOME="$JAVA_HOME_11_X64" ./gradlew --no-daemon -q \
            :core-api-java6:jar :core-api-java6:generatePomFileForReleasePublication
          dir="$HOME/.m2/repository/com/absmartly/sdk/core-api-java6/1.9.0"
          mkdir -p "$dir"
          cp core-api-java6/build/libs/core-api-java6.jar "$dir/core-api-java6-1.9.0.jar"
          cp core-api-java6/build/publications/release/pom-default.xml "$dir/core-api-java6-1.9.0.pom"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the vendored cross-SDK scenarios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/check_cross_sdk_scenarios.py

      - name: Run unit tests
        run: ./gradlew :android-sdk:test --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew :android-sdk:lint --no-daemon --stacktrace

      - name: Assemble release
        run: ./gradlew :android-sdk:assembleRelease --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-reports
          path: |
            android-sdk/build/reports/
            android-sdk/build/test-results/
          if-no-files-found: ignore

name: Android CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and assemble release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :android-sdk:test --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew :android-sdk:lint --no-daemon --stacktrace

      - name: Assemble release
        run: ./gradlew :android-sdk:assembleRelease --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-reports
          path: |
            android-sdk/build/reports/
            android-sdk/build/test-results/
          if-no-files-found: ignore
